---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: ente-web
    path: deployment.patch.yaml

replacements:
  # assumes there will be a ConfigMap named ente-vars with a hostname key
  - source:
      kind: ConfigMap
      name: ente-vars
      fieldPath: data.hostname
    targets:
      - select:
          kind: Ingress
          name: ente
        fieldPaths:
          - spec.rules.*.host
        options:
          delimiter: "."
          index: 2
      - select:
          kind: Deployment
          name: ente-web
        fieldPaths:
          - spec.template.spec.containers.*.env.[name=ENTE_API_ORIGIN].value
          - spec.template.spec.containers.*.env.[name=ENTE_ALBUMS_ORIGIN].value
        options:
          delimiter: "."
          index: 2