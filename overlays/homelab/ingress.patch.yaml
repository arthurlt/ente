---
- op: add
  path: /metadata/annotations
  value:
    cert-manager.io/cluster-issuer: lets-encrypt
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, X-Auth-Token, X-Auth-Access-Token, X-Cast-Access-Token, X-Auth-Access-Token-JWT, X-Client-Package, X-Client-Version, Authorization, accept, origin, Cache-Control, X-Requested-With, upgrade-insecure-requests"
    # nginx.ingress.kubernetes.io/cors-expose-headers: "X-Request-Id"
    # nginx.ingress.kubernetes.io/cors-allow-methods: "POST, OPTIONS, GET, PUT, PATCH, DELETE"
    # nginx.ingress.kubernetes.io/cors-max-age: "1728000"
- op: add
  path: /spec/ingressClassName
  value: nginx
- op: add
  path: /spec/tls
  value:
    - secretName: ente-certs
      hosts:
        - accounts.ente.arthur.computer
        - albums.ente.arthur.computer
        - api.ente.arthur.computer
        - cast.ente.arthur.computer
        - web.ente.arthur.computer
        - locker.ente.arthur.computer
