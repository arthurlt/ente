---
- op: replace
  path: /spec/instances
  value: 2
- op: replace
  path: /spec/storage
  value:
    storageClass: local-path
    size: 20Gi
    resizeInUseVolumes: true
- op: add
  path: /spec
  value:
    plugins:
      - name: barman-cloud.cloudnative-pg.io
        isWALArchiver: true
        parameters:
          barmanObjectName: ente-database-s3