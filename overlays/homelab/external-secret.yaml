---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ente-museum-secrets
  labels:
    app.kubernetes.io/component: museum
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      metadata:
        # is it possible to dynamically add these?
        labels:
          app.kubernetes.io/name: ente
          app.kubernetes.io/part-of: homelab-ente
          app.kubernetes.io/component: museum
      engineVersion: v2
      data:
        credentials.yaml: |
          s3:
            b2-eu-cen:
              key: "{{ .s3AccessKey }}"
              secret: "{{ .s3SecretKey }}"
              endpoint: "{{ .s3Endpoint }}"
          key:
            encryption: "{{ .keyEncryption }}"
            hash: "{{ .keyHash }}"
          jwt:
            secret: "{{ .jwt }}"
          smtp:
            username: "{{ .smtpUser }}"
            password: "{{ .smtpPass }}"
          internal:
            admin: "{{ .adminId }}"
  data:
    # s3 values
    - secretKey: s3AccessKey
      remoteRef:
        key: R2 ente-primary/username
    - secretKey: s3SecretKey
      remoteRef:
        key: R2 ente-primary/credential
    - secretKey: s3Endpoint
      remoteRef:
        key: R2 ente-primary/endpoint
    # key values
    - secretKey: keyEncryption
      remoteRef:
        key: ente Encryption Key/encryption
    - secretKey: keyHash
      remoteRef:
        key: ente Encryption Key/hash
    # jwt values
    - secretKey: jwt
      remoteRef:
        key: ente JWT Secret/credential
    # smtp values
    - secretKey: smtpUser
      remoteRef:
        key: ente Fastmail App Password/username
    - secretKey: smtpPass
      remoteRef:
        key: ente Fastmail App Password/password
    # internal values
    - secretKey: adminId
      remoteRef:
        key: lwhwikzzt6z2dc2e2effpq4znm/user id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ente-database-s3
  labels:
    app.kubernetes.io/component: database
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      metadata:
        # is it possible to dynamically add these?
        labels:
          app.kubernetes.io/name: ente
          app.kubernetes.io/part-of: homelab-ente
          app.kubernetes.io/component: database
  data:
    - secretKey: accessKey
      remoteRef:
        key: R2 cnpg-backups/username
    - secretKey: secretKey
      remoteRef:
        key: R2 cnpg-backups/credential
