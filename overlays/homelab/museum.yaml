s3:
  b2-eu-cen:
    # we want to use SSL
    are_local_buckets: false
    # R2 doesn't support subdomain-style
    use_path_style_urls: true
    # R2 docs suggest setting to 'auto'
    region: auto
    bucket: ente-primary

smtp:
  host: smtp.fastmail.com
  port: 587
  sender-name: Ente
  encryption: tls