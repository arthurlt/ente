---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ente-museum
  labels:
    app.kubernetes.io/component: api-server
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-server
    spec:
      serviceAccountName: ente
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: museum
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          image: ghcr.io/ente-io/server
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT
              value: local
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 196Mi
          volumeMounts:
            - name: museum-data
              mountPath: /data
      volumes:
        - name: museum-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ente-web
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: ente
      securityContext:
        # fsGroup: 1000
        # fsGroupChangePolicy: OnRootMismatch
        # runAsGroup: 1000
        # runAsNonRoot: true
        # runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          image: ghcr.io/ente-io/web
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
          ports:
            - name: web
              containerPort: 3000
              protocol: TCP
            - name: accounts
              containerPort: 3001
              protocol: TCP
            - name: albums
              containerPort: 3002
              protocol: TCP
            - name: auth
              containerPort: 3003
              protocol: TCP
            - name: cast
              containerPort: 3004
              protocol: TCP
            - name: locker
              containerPort: 3005
              protocol: TCP
            - name: embed
              containerPort: 3006
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: web
          readinessProbe:
            httpGet:
              path: /
              port: web
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 128Mi
